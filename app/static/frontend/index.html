<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="运维管理后台">
  <title>运维管理后台</title>
  <link rel="stylesheet" href="{{ url_for_frontend('static/vendor/modern-normalize.css') }}">
  <link rel="stylesheet" href="{{ url_for_frontend('static/app.css?v=20260626-system1') }}">
  <link rel="stylesheet" href="{{ url_for_frontend('static/frontend/styles.css?v=20260626-system1') }}">
  <script src="{{ url_for_frontend('static/vendor/lucide.min.js?v=20260626-system1') }}" defer></script>
  <script src="{{ url_for_frontend('static/frontend/app.js?v=20260626-system1') }}" defer></script>
  <script>
    window.APP_CONFIG = {
      apiBase: "{{ api_prefix }}",
      frontendBase: "{{ frontend_base_path }}",
      artifactBase: "/artifact"
    };
  </script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for_frontend('/') }}" aria-label="运维管理后台">
      <span class="brand-mark"><img src="{{ url_for_frontend('static/images/logo.svg') }}" alt=""></span>
      <span>运维管理后台</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a class="nav-link active" href="{{ url_for_frontend('/') }}#/jobs" data-view="dashboard"><span
          data-lucide="clipboard-list"></span>巡检任务</a>
      <a class="nav-link" href="{{ url_for_frontend('/') }}#/runs" data-view="runs"><span
          data-lucide="history"></span>巡检记录</a>
      <a class="nav-link" href="{{ url_for_frontend('/') }}#/periodic" data-view="periodic"><span
          data-lucide="file-archive"></span>周期报告</a>
      <a class="nav-link" href="{{ url_for_frontend('/') }}#/auth" data-view="auth"><span
          data-lucide="key-round"></span>认证配置</a>
      <a class="nav-link" href="{{ url_for_frontend('/') }}#/mail" data-view="mail"><span
          data-lucide="mail"></span>邮件配置</a>
      <a class="nav-link" href="{{ url_for_frontend('/') }}#/storage" data-view="storage"><span
          data-lucide="settings"></span>系统配置</a>
      <a class="nav-link nav-logout" href="{{ url_for_frontend('logout') }}"><span data-lucide="log-out"></span>退出</a>
    </nav>
  </header>

  <main class="shell">
    <section data-view-panel="dashboard">
      <div class="page-head">
        <div>
          <h1>巡检任务</h1>
          <p class="muted">配置巡检任务、截图项和报告发送，按中文选项填写即可。</p>
        </div>
        <div class="action-row">
          <button class="button" type="button" data-action="refresh"><span data-lucide="refresh-cw"></span>刷新数据</button>
          <button class="button primary" type="button" data-action="new-job"><span
              data-lucide="plus"></span>新增任务</button>
        </div>
      </div>

      <div class="metrics-grid" data-region="metrics"></div>

      <div class="section-title">
        <h2>巡检任务</h2>
        <button class="button" type="button" data-action="new-job"><span data-lucide="plus"></span>新增任务</button>
      </div>
      <section class="panel" data-region="jobs"></section>

      <div class="section-title">
        <h2>最近运行</h2>
        <button class="button" type="button" data-view-shortcut="runs">查看全部</button>
      </div>
      <section class="panel" data-region="recent-runs"></section>
    </section>

    <section data-view-panel="runs" hidden>
      <div class="page-head">
        <div>
          <h1>运检记录</h1>
          <p class="muted">查看每次巡检状态、截图数量、邮件状态和报告下载。</p>
        </div>
        <button class="button" type="button" data-action="refresh"><span data-lucide="refresh-cw"></span>刷新数据</button>
      </div>
      <section class="panel" data-region="runs"></section>
    </section>

    <section data-view-panel="periodic" hidden>
      <div class="page-head">
        <div>
          <h1>周期报告</h1>
          <p class="muted">按周或按月汇总巡检 Word 文档，并发送压缩包。</p>
        </div>
        <button class="button" type="button" data-action="refresh-periodic"><span
            data-lucide="refresh-cw"></span>刷新数据</button>
      </div>
      <section class="panel" data-region="periodic"></section>
    </section>

    <section data-view-panel="auth" hidden>
      <div class="page-head">
        <div>
          <h1>认证配置</h1>
          <p class="muted">管理需要登录的目标系统账号，普通用户只填写简单信息。</p>
        </div>
        <div class="action-row">
          <button class="button primary" type="button" data-action="new-auth"><span
              data-lucide="plus"></span>新增认证</button>
        </div>
      </div>
      <section class="panel" data-region="auth-profiles"></section>
    </section>

    <section data-view-panel="mail" hidden>
      <div class="page-head">
        <div>
          <h1>邮件配置</h1>
          <p class="muted">配置报告发送邮箱，保存后可直接测试发送。</p>
        </div>
        <div class="action-row">
          <button class="button primary" type="button" data-action="new-mail"><span
              data-lucide="plus"></span>新增邮箱</button>
        </div>
      </div>
      <section class="panel" data-region="mail-profiles"></section>
    </section>

    <section data-view-panel="storage" hidden>
      <div class="page-head">
        <div>
          <h1>系统配置</h1>
          <p class="muted">查看数据占用，设置截图、报告和日志保留时间。</p>
        </div>
        <div class="action-row">
          <button class="button" type="button" data-action="refresh-storage"><span
              data-lucide="refresh-cw"></span>刷新数据</button>
        </div>
      </div>
      <section class="panel" data-region="storage-panel"></section>
    </section>
  </main>

  <div class="toast-container" data-region="toasts"></div>
  <div class="modal-root" data-region="modal" hidden></div>
  <div class="confirm-root" data-region="confirm" hidden></div>
</body>

</html>
