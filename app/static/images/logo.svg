<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep Navy to Electric Blue gradient for the main wave -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <!-- Neon green gradient for the inner success check -->
    <linearGradient id="checkGrad7" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Transparent background for clean integration -->

  <!-- Outer Wave (IT monitor pulse that sweeps up to a check) -->
  <path d="M 5 20 L 9 20 L 11 24 L 14 11 L 17 18 L 26 9" fill="none" stroke="url(#waveGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow7)" />

  <!-- Inner nested Success Check (highlights validation) -->
  <path d="M 13.5 17.5 L 16 20 L 21.5 13" fill="none" stroke="url(#checkGrad7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow7)" />

  <!-- Accent pulsing dot -->
  <circle cx="5" cy="20" r="1.2" fill="#2563EB" />
  <circle cx="26" cy="9" r="1.2" fill="#34D399" />
</svg>
