{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ "编辑邮箱" if profile.id else "新增邮箱" }}</h1>
  </div>
</div>

<form method="post" action="{{ action }}" class="panel form-page">
  <!-- 第一部分：基本配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">基本信息</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      名称 <span style="color: var(--danger);">*</span>
      <input name="name" value="{{ profile.name or '' }}" required placeholder="例如：139发信配置">
    </label>
    
    <label>
      SMTP 服务器 <span style="color: var(--danger);">*</span>
      <input name="smtp_host" value="{{ profile.smtp_host or '' }}" placeholder="例如：smtp.139.com" required>
    </label>
    
    <label>
      SMTP 端口 <span style="color: var(--danger);">*</span>
      <input name="smtp_port" type="number" value="{{ profile.smtp_port or 465 }}" required>
      <span class="form-tip">SSL：465；STARTTLS：587。</span>
    </label>
  </div>

  <!-- 第二部分：认证配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">发信账号</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      发信账号 <span style="color: var(--danger);">*</span>
      <input name="username" value="{{ profile.username or '' }}" placeholder="username@139.com" required>
    </label>
    
    <label>
      密码或授权码 <span style="color: var(--danger);">*</span>
      <div style="position: relative; display: flex; align-items: center; width: 100%;">
        <input name="password" id="mail_password_input" type="password" value="" {% if not profile.id %}required{% endif %} placeholder="{{ '已保存，留空沿用原密码' if profile.id else '请输入发信密码或授权密码' }}" style="padding-right: 40px; width: 100%;">
        <button type="button" onclick="togglePasswordVisibility('mail_password_input', this)" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center;" title="显示/隐藏密码" aria-label="显示密码">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <span class="form-tip">多数邮箱需填写授权码。</span>
    </label>

    <div class="span-2 mail-security-options" style="display: flex; gap: 24px; margin-top: 8px;">
      <label class="check">
        <input name="use_ssl" type="checkbox" {% if profile.use_ssl is not defined or profile.use_ssl %}checked{% endif %}>
        SSL（465 端口）
      </label>
      
      <label class="check">
        <input name="use_starttls" type="checkbox" {% if profile.use_starttls %}checked{% endif %}>
        STARTTLS（587/25 端口）
      </label>
    </div>
  </div>

  <!-- 第三部分：收发件人设置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">收发件人</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      发件人 <span style="color: var(--danger);">*</span>
      <input name="sender" value="{{ profile.sender or '' }}" placeholder="username@139.com" required>
    </label>
    
    <label>
      收件人 <span style="color: var(--danger);">*</span>
      <input name="recipients" value="{{ profile.recipients or '' }}" placeholder="ops@example.com, manager@example.com" required>
      <span class="form-tip">多个地址用英文逗号隔开。</span>
    </label>
    
    <label class="span-2">
      抄送（选填）
      <input name="cc" value="{{ profile.cc or '' }}" placeholder="monitor@example.com">
    </label>
  </div>

  <!-- 第四部分：邮件主题与正文模板 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">邮件内容</h3>
  <div class="form-grid" style="margin-bottom: 24px;">
    <label class="span-2">
      邮件主题 <span style="color: var(--danger);">*</span>
      <input name="subject_template" value="{{ profile.subject_template or '自动化巡检报告 - {date}' }}" required>
      <span class="form-tip">可用变量：<code>{date}</code>（生成日期）、<code>{job_name}</code>（任务名称）。</span>
    </label>
    
    <label class="span-2">
      邮件正文 <span style="color: var(--danger);">*</span>
      <textarea name="body_template" rows="5" required>{{ profile.body_template or '巡检报告已生成，请查看附件。' }}</textarea>
    </label>
  </div>
  
  <div class="form-actions span-2">
    <button class="primary" type="submit" style="font-weight: 600;">保存邮件配置</button>
    <a class="button" href="{{ url_for_frontend('/mail-profiles') }}">取消</a>
  </div>
</form>

<script>
  const eyeSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
  const eyeOffSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = eyeOffSvg;
      btn.setAttribute('aria-label', '隐藏密码');
    } else {
      input.type = 'password';
      btn.innerHTML = eyeSvg;
      btn.setAttribute('aria-label', '显示密码');
    }
  }
</script>
{% endblock %}
