{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ "编辑截图项" if item.id else "新增截图项" }}</h1>
  </div>
</div>

<form method="post" action="{{ action }}" class="panel form-page">
  <!-- 第一部分：基本配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">基本信息</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      截图项名称 <span style="color: var(--danger);">*</span>
      <input name="name" value="{{ item.name or '' }}" required placeholder="例如：应用CPU使用率看板">
    </label>
    <label>
      类型 <span style="color: var(--danger);">*</span>
      <select name="item_type">
        {% for t in [("grafana", "Grafana 看板"), ("kibana", "Kibana 仪表盘"), ("web", "常规 HTML 网页")] %}
        <option value="{{ t[0] }}" {% if item.item_type == t[0] %}selected{% endif %}>{{ t[1] }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="span-2">
      页面地址 <span style="color: var(--danger);">*</span>
      <textarea name="url" rows="3" required placeholder="http://localhost:3000/d/xxxxxx">{{ item.url or '' }}</textarea>
    </label>
    <label>
      报告章节 <span style="color: var(--danger);">*</span>
      <input name="section" value="{{ item.section or '巡检截图' }}" required list="template-section-options" placeholder="如：1服务器资源">
      <datalist id="template-section-options">
        {% for section in template_sections or [] %}
        <option value="{{ section }}"></option>
        {% endfor %}
      </datalist>
    </label>
    <label>
      登录认证
      <select name="auth_profile_id">
        <option value="">无需登录</option>
        {% for profile in auth_profiles %}
        <option value="{{ profile.id }}" {% if item.auth_profile_id == profile.id %}selected{% endif %}>{{ profile.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <!-- 第二部分：截图与加载配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">截图与等待</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label class="span-2">
      截图模式 <span style="color: var(--danger);">*</span>
      <select name="capture_mode" onchange="toggleCssSelector(this.value)">
        <option value="viewport" {% if item.capture_mode == "viewport" %}selected{% endif %}>视口截图</option>
        <option value="full_page" id="opt_full_page" {% if item.capture_mode == "full_page" %}selected{% endif %}>整页截图</option>
        <option value="selector" id="opt_selector" {% if item.capture_mode == "selector" %}selected{% endif %}>元素截图</option>
      </select>
    </label>
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;" class="span-2">
      <label class="check">
        <input type="checkbox" id="real_browser_capture" name="real_browser_capture" {% if item.real_browser_capture %}checked{% endif %} onchange="onRealBrowserCaptureChange(this.checked)">
        真实浏览器窗口截图
        <span class="form-tip" style="display: block; margin-top: 4px; font-weight: normal;">
          截取完整浏览器窗口，包含标签、地址栏和右上角按钮。
        </span>
      </label>
    </div>
    <label id="css_selector_container">
      CSS 选择器（元素截图） <span style="color: var(--danger);">*</span>
      <input name="css_selector" value="{{ item.css_selector or '' }}" placeholder="例如：div[data-panelid='12'] 或 #my-chart-id">
      <span class="form-tip">元素截图时必填。</span>
    </label>
    <label>
      等待元素
      <input name="wait_selector" value="{{ item.wait_selector or '' }}" placeholder="例如：.react-grid-layout">
      <span class="form-tip">选填；元素出现后再截图。</span>
    </label>
    <label>
      手动等待（秒） <span style="color: var(--danger);">*</span>
      <input name="wait_seconds" type="number" step="0.5" min="0" value="{{ item.wait_seconds if item.wait_seconds is not none else 3.0 }}" required>
    </label>
    <label>
      单次页面截图超时（秒） <span style="color: var(--danger);">*</span>
      <input name="timeout_seconds" type="number" min="1" value="{{ item.timeout_seconds or 60 }}" required>
      <span class="form-tip">只计算页面访问到截图完成。</span>
    </label>
    <label>
      单项最长耗时（秒） <span style="color: var(--danger);">*</span>
      <input name="total_timeout_seconds" type="number" min="1" value="{{ item.total_timeout_seconds or 240 }}" required>
      <span class="form-tip">包含登录和重试；到时自动停止。</span>
    </label>
    <label>
      失败重试次数 <span style="color: var(--danger);">*</span>
      <input name="retry_count" type="number" value="{{ item.retry_count if item.retry_count is not none else 2 }}" required>
    </label>
  </div>

  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">水印</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;" class="span-2">
      <label class="check">
        <input type="checkbox" id="watermark_enabled" name="watermark_enabled" {% if item.watermark_enabled %}checked{% endif %} onchange="onWatermarkChange(this.checked)">
        启用截屏水印
      </label>
    </div>
    <div id="watermark_config" class="span-2 form-grid" style="padding: 0;">
      <label class="check span-2">
        <input type="checkbox" id="watermark_time_enabled" name="watermark_time_enabled" {% if item.watermark_time_enabled %}checked{% endif %} onchange="onWatermarkTimeChange(this.checked)">
        启用时间水印
      </label>
      <label class="span-2" id="watermark_time_format_field">
        时间格式
        <select name="watermark_time_format">
          {% for option in watermark_time_formats %}<option value="{{ option.id }}" {% if item.watermark_time_format == option.id %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
        </select>
      </label>
      <label class="span-2">
        自定义水印内容
        <textarea name="watermark_text" rows="3">{{ item.watermark_text or '' }}</textarea>
        <span class="form-tip">可留空，仅显示时间水印。</span>
      </label>
      <label>
        透明度
        <input name="watermark_opacity" type="number" min="0" max="255" value="{{ item.watermark_opacity if item.watermark_opacity is not none else 65 }}">
      </label>
      <label>
        字号
        <input name="watermark_font_size" type="number" min="10" max="72" value="{{ item.watermark_font_size if item.watermark_font_size is not none else 24 }}">
      </label>
      <label>
        横向间距
        <input name="watermark_gap_x" type="number" min="20" max="800" value="{{ item.watermark_gap_x if item.watermark_gap_x is not none else 140 }}">
      </label>
      <label>
        纵向间距
        <input name="watermark_gap_y" type="number" min="20" max="800" value="{{ item.watermark_gap_y if item.watermark_gap_y is not none else 140 }}">
      </label>
      <label>
        倾斜角度
        <input name="watermark_angle" type="number" min="-90" max="90" value="{{ item.watermark_angle if item.watermark_angle is not none else -45 }}">
      </label>
    </div>
  </div>

  <!-- Windows 任务栏风格 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">任务栏</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;" class="span-2">
      <label class="check">
        <input type="checkbox" id="taskbar_enabled" name="taskbar_enabled" {% if item.taskbar_enabled is not defined or item.taskbar_enabled %}checked{% endif %}>
        启用 Windows 任务栏风格
      </label>
    </div>
  </div>

  <!-- 第五部分：调试与尺寸选项 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">尺寸与排序</h3>
  <div class="form-grid" style="margin-bottom: 24px;">
    <label>
      浏览器宽度（px）
      <input name="browser_width" type="number" value="{{ item.browser_width or '' }}" placeholder="留空使用任务设置">
    </label>
    <label>
      浏览器高度（px）
      <input name="browser_height" type="number" value="{{ item.browser_height or '' }}" placeholder="留空使用任务设置">
    </label>
    <label>
      报告排序
      <input name="sort_order" type="number" value="{{ item.sort_order or 100 }}" required>
      <span class="form-tip">数字越小，在报告中越靠前。</span>
    </label>
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;">
      <label class="check">
        <input name="enabled" type="checkbox" {% if item.enabled is not defined or item.enabled %}checked{% endif %}>
        启用截图项
      </label>
    </div>
  </div>

  <div class="form-actions span-2">
    <button class="primary" type="submit" style="font-weight: 600;">保存截图项配置</button>
    <a class="button" href="{{ url_for_frontend('/jobs/' ~ job_id) }}">取消并返回</a>
  </div>
</form>

<script>
  function toggleCssSelector(val) {
    const container = document.getElementById('css_selector_container');
    if (val === 'selector') {
      container.style.opacity = '1';
      container.style.pointerEvents = 'auto';
      container.querySelector('input').setAttribute('required', 'required');
    } else {
      container.style.opacity = '0.5';
      container.style.pointerEvents = 'none';
      container.querySelector('input').removeAttribute('required');
    }
  }

  function onRealBrowserCaptureChange(checked, isInit = false) {
    const select = document.getElementsByName('capture_mode')[0];
    const fullPageOpt = document.getElementById('opt_full_page');
    const selectorOpt = document.getElementById('opt_selector');
    const cssContainer = document.getElementById('css_selector_container');
    const cssInput = cssContainer ? cssContainer.querySelector('input') : null;

    if (checked) {
      if (!isInit) {
        select.value = 'viewport';
        toggleCssSelector('viewport');
        if (cssInput) {
          cssInput.value = '';
        }
      }
      if (fullPageOpt) {
        fullPageOpt.disabled = true;
      }
      if (selectorOpt) {
        selectorOpt.disabled = true;
      }
      if (!isInit && cssInput) {
        cssInput.removeAttribute('required');
      }
    } else {
      if (fullPageOpt) {
        fullPageOpt.disabled = false;
      }
      if (selectorOpt) {
        selectorOpt.disabled = false;
      }
    }
  }

  function onWatermarkChange(checked) {
    const config = document.getElementById('watermark_config');
    if (!config) {
      return;
    }
    config.style.display = checked ? '' : 'none';
    onWatermarkTimeChange(checked && document.getElementById('watermark_time_enabled').checked);
  }

  function onWatermarkTimeChange(checked) {
    const field = document.getElementById('watermark_time_format_field');
    if (field) field.style.display = checked ? '' : 'none';
  }

  // Initialize state
  document.addEventListener('DOMContentLoaded', () => {
    const checkbox = document.getElementById('real_browser_capture');
    if (checkbox) {
      onRealBrowserCaptureChange(checkbox.checked, true);
    }
    toggleCssSelector(document.getElementsByName('capture_mode')[0].value);
    const watermarkCheckbox = document.getElementById('watermark_enabled');
    if (watermarkCheckbox) {
      onWatermarkChange(watermarkCheckbox.checked);
    }
  });
</script>
{% endblock %}
