{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ "编辑截图项" if item.id else "新增截图项" }}</h1>
  </div>
</div>

<form method="post" action="{{ action }}" class="panel form-page">
  <!-- 第一部分：基本配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">基本信息</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      截图项名称 <span style="color: var(--danger);">*</span>
      <input name="name" value="{{ item.name or '' }}" required placeholder="例如：应用CPU使用率看板">
    </label>
    <label>
      类型 <span style="color: var(--danger);">*</span>
      <select name="item_type">
        {% for t in [("grafana", "Grafana 看板"), ("kibana", "Kibana 仪表盘"), ("web", "常规 HTML 网页")] %}
        <option value="{{ t[0] }}" {% if item.item_type == t[0] %}selected{% endif %}>{{ t[1] }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="span-2">
      页面地址 <span style="color: var(--danger);">*</span>
      <textarea name="url" rows="3" required placeholder="http://localhost:3000/d/xxxxxx">{{ item.url or '' }}</textarea>
    </label>
    {% if template_selected %}
    <label>
      模板章节 <span style="color: var(--danger);">*</span>
      <select name="section" required>
        <option value="" disabled {% if item.section not in template_sections %}selected{% endif %}>请选择模板章节</option>
        {% for section in template_sections or [] %}
        <option value="{{ section }}" {% if item.section == section %}selected{% endif %}>{{ section }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
    <label>
      登录认证
      <select name="auth_profile_id">
        <option value="">无需登录</option>
        {% for profile in auth_profiles %}
        <option value="{{ profile.id }}" {% if item.auth_profile_id == profile.id %}selected{% endif %}>{{ profile.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <!-- 第二部分：截图与加载配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">截图与等待</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label class="span-2">
      截图模式 <span style="color: var(--danger);">*</span>
      <select name="capture_mode" onchange="toggleCssSelector(this.value)">
        <option value="viewport" {% if item.capture_mode == "viewport" %}selected{% endif %}>视口截图</option>
        <option value="full_page" id="opt_full_page" {% if item.capture_mode == "full_page" %}selected{% endif %}>整页截图</option>
        <option value="selector" id="opt_selector" {% if item.capture_mode == "selector" %}selected{% endif %}>元素截图</option>
      </select>
    </label>
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;" class="span-2">
      <label class="check">
        <input type="checkbox" id="real_browser_capture" name="real_browser_capture" {% if item.real_browser_capture %}checked{% endif %} onchange="onRealBrowserCaptureChange(this.checked)">
        真实浏览器窗口截图
        <span class="form-tip" style="display: block; margin-top: 4px; font-weight: normal;">
          截取完整浏览器窗口，包含标签、地址栏和右上角按钮。
        </span>
      </label>
    </div>
    <label id="css_selector_container">
      CSS 选择器（元素截图） <span style="color: var(--danger);">*</span>
      <input name="css_selector" value="{{ item.css_selector or '' }}" placeholder="例如：div[data-panelid='12'] 或 #my-chart-id">
      <span class="form-tip">元素截图时必填。</span>
    </label>
    <label>
      等待元素
      <input name="wait_selector" value="{{ item.wait_selector or '' }}" placeholder="例如：.react-grid-layout">
      <span class="form-tip">选填；元素出现后再截图。</span>
    </label>
    <label>
      手动等待（秒） <span style="color: var(--danger);">*</span>
      <input name="wait_seconds" type="number" step="0.5" min="0" value="{{ item.wait_seconds if item.wait_seconds is not none else 3.0 }}" required>
    </label>
    <label>
      单次页面截图超时（秒） <span style="color: var(--danger);">*</span>
      <input name="timeout_seconds" type="number" min="1" value="{{ item.timeout_seconds or 60 }}" required>
      <span class="form-tip">只计算页面访问到截图完成。</span>
    </label>
    <label>
      单项最长耗时（秒） <span style="color: var(--danger);">*</span>
      <input name="total_timeout_seconds" type="number" min="1" value="{{ item.total_timeout_seconds or 240 }}" required>
      <span class="form-tip">包含登录和重试；到时自动停止。</span>
    </label>
    <label>
      失败重试次数 <span style="color: var(--danger);">*</span>
      <input name="retry_count" type="number" value="{{ item.retry_count if item.retry_count is not none else 2 }}" required>
    </label>
  </div>

  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">水印</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;" class="span-2">
      <label class="check">
        <input type="checkbox" id="watermark_enabled" name="watermark_enabled" {% if item.watermark_enabled %}checked{% endif %} onchange="onWatermarkChange(this.checked)">
        启用截屏水印
      </label>
    </div>
    <div id="watermark_config" class="span-2 form-grid" style="padding: 0;">
      <input type="hidden" name="watermark_time_enabled" value="1">
      <input type="hidden" name="watermark_time_format" value="datetime_seconds">
      <input type="hidden" name="watermark_font_size" value="53">
      <input type="hidden" name="watermark_gap_x" value="234">
      <input type="hidden" name="watermark_gap_y" value="594">
      <input type="hidden" name="watermark_alignment" value="reference">
      <input type="hidden" id="watermark_angle" name="watermark_angle" value="{{ item.watermark_angle if item.watermark_angle is not none and 6 <= item.watermark_angle <= 66 else 36 }}">
      <label class="span-2">
        姓名／标识
        <input name="watermark_text" type="text" maxlength="200" value="{{ item.watermark_text or '' }}" placeholder="例如：王">
        <span class="form-tip">显示在时间上方；时间会在截图时自动更新。</span>
      </label>
      <label>
        透明度
        <input name="watermark_opacity" type="number" min="0" max="255" value="{{ item.watermark_opacity if item.watermark_opacity is not none else 20 }}">
        <span class="form-tip">默认 20；数值越大，水印越明显。</span>
      </label>
      <label>
        倾斜角度微调
        <input id="watermark_angle_offset" type="number" min="-30" max="30" step="1" value="{{ (item.watermark_angle - 36) if item.watermark_angle is not none and 6 <= item.watermark_angle <= 66 else 0 }}">
        <span class="form-tip">默认 0°；在自动适配的角度上增减。</span>
      </label>
    </div>
    <div id="watermark_preview_layout" class="span-2" style="margin-top: 6px; max-width: 100%; justify-self: start;">
      <div style="display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px;"><strong>效果预览</strong><span id="watermark_preview_size" class="form-tip"></span></div>
      <div id="watermark_preview_frame" style="position: relative; overflow: hidden; border: 1px solid #d7e0e8; border-radius: 8px; background: #fff;">
        <img id="watermark_preview_image" alt="当前水印效果预览" style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill;">
        <span id="watermark_preview_status" style="position: absolute; inset: 0; display: grid; place-items: center; color: #667784; background: rgba(255,255,255,.45);">正在生成预览…</span>
      </div>
    </div>
    <button type="button" id="watermark_reset" class="button secondary" style="margin-top: 4px;">恢复默认</button>
  </div>

  <!-- Windows 任务栏风格 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">任务栏</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;" class="span-2">
      <label class="check">
        <input type="checkbox" id="taskbar_enabled" name="taskbar_enabled" {% if item.taskbar_enabled is not defined or item.taskbar_enabled %}checked{% endif %}>
        启用 Windows 任务栏风格
      </label>
    </div>
  </div>

  <!-- 第五部分：调试与尺寸选项 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">尺寸与排序</h3>
  <div class="form-grid" style="margin-bottom: 24px;">
    <label>
      浏览器宽度（px）
      <input name="browser_width" type="number" value="{{ item.browser_width or '' }}" placeholder="留空使用任务设置">
    </label>
    <label>
      浏览器高度（px）
      <input name="browser_height" type="number" value="{{ item.browser_height or '' }}" placeholder="留空使用任务设置">
    </label>
    <label>
      报告排序
      <input name="sort_order" type="number" value="{{ item.sort_order or 100 }}" required>
      <span class="form-tip">数字越小，在报告中越靠前。</span>
    </label>
    <div style="display: flex; align-items: flex-end; padding-bottom: 8px;">
      <label class="check">
        <input name="enabled" type="checkbox" {% if item.enabled is not defined or item.enabled %}checked{% endif %}>
        启用截图项
      </label>
    </div>
  </div>

  <div class="form-actions span-2">
    <button class="primary" type="submit" style="font-weight: 600;">保存截图项配置</button>
    <a class="button" href="{{ url_for_frontend('/jobs/' ~ job_id) }}">取消并返回</a>
  </div>
</form>

<script>
  function toggleCssSelector(val) {
    const container = document.getElementById('css_selector_container');
    if (val === 'selector') {
      container.style.opacity = '1';
      container.style.pointerEvents = 'auto';
      container.querySelector('input').setAttribute('required', 'required');
    } else {
      container.style.opacity = '0.5';
      container.style.pointerEvents = 'none';
      container.querySelector('input').removeAttribute('required');
    }
  }

  function onRealBrowserCaptureChange(checked, isInit = false) {
    const select = document.getElementsByName('capture_mode')[0];
    const fullPageOpt = document.getElementById('opt_full_page');
    const selectorOpt = document.getElementById('opt_selector');
    const cssContainer = document.getElementById('css_selector_container');
    const cssInput = cssContainer ? cssContainer.querySelector('input') : null;

    if (checked) {
      if (!isInit) {
        select.value = 'viewport';
        toggleCssSelector('viewport');
        if (cssInput) {
          cssInput.value = '';
        }
      }
      if (fullPageOpt) {
        fullPageOpt.disabled = true;
      }
      if (selectorOpt) {
        selectorOpt.disabled = true;
      }
      if (!isInit && cssInput) {
        cssInput.removeAttribute('required');
      }
    } else {
      if (fullPageOpt) {
        fullPageOpt.disabled = false;
      }
      if (selectorOpt) {
        selectorOpt.disabled = false;
      }
    }
  }

  function onWatermarkChange(checked) {
    const config = document.getElementById('watermark_config');
    if (config) config.style.display = checked ? '' : 'none';
    scheduleWatermarkPreview();
  }

  let watermarkPreviewTimer;
  let watermarkPreviewRequestId = 0;
  function scheduleWatermarkPreview() {
    clearTimeout(watermarkPreviewTimer);
    const requestId = ++watermarkPreviewRequestId;
    const form = document.querySelector('form.form-page');
    const enabled = document.getElementById('watermark_enabled').checked;
    const image = document.getElementById('watermark_preview_image');
    const status = document.getElementById('watermark_preview_status');
    const width = Math.min(7680, Math.max(800, Number(form.elements.browser_width.value) || {{ preview_browser_width | int }}));
    const height = Math.min(8640, Math.max(600, Number(form.elements.browser_height.value) || {{ preview_browser_height | int }}));
    const frame = document.getElementById('watermark_preview_frame');
    frame.style.aspectRatio = `${width} / ${height}`;
    document.getElementById('watermark_preview_layout').style.width = `min(100%, ${Math.min(1400, Math.round(760 * width / height))}px)`;
    document.getElementById('watermark_preview_size').textContent = `${width} × ${height}`;
    const angle = 36 + (Number(document.getElementById('watermark_angle_offset').value) || 0);
    document.getElementById('watermark_angle').value = String(angle);
    if (!enabled) {
      image.removeAttribute('src');
      image.style.display = 'none';
      status.textContent = '水印已关闭';
      status.style.display = 'grid';
      return;
    }
    status.textContent = '正在生成预览…';
    status.style.display = 'grid';
    watermarkPreviewTimer = setTimeout(async () => {
      try {
        const response = await fetch({{ (api_prefix ~ '/watermark/preview') | tojson }}, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            watermark_enabled: true,
            watermark_time_enabled: true,
            watermark_time_format: 'datetime_seconds',
            watermark_text: form.elements.watermark_text.value,
            watermark_opacity: Number(form.elements.watermark_opacity.value),
            watermark_angle: angle,
            watermark_alignment: 'reference',
            image_width: width,
            image_height: height,
          }),
        });
        if (!response.ok) throw new Error('预览生成失败');
        const data = await response.json();
        if (requestId !== watermarkPreviewRequestId) return;
        image.src = data.image;
        image.style.display = 'block';
        status.style.display = 'none';
      } catch (error) {
        if (requestId !== watermarkPreviewRequestId) return;
        image.removeAttribute('src');
        image.style.display = 'none';
        status.textContent = '预览生成失败';
        status.style.display = 'grid';
      }
    }, 250);
  }

  // Initialize state
  document.addEventListener('DOMContentLoaded', () => {
    const checkbox = document.getElementById('real_browser_capture');
    if (checkbox) {
      onRealBrowserCaptureChange(checkbox.checked, true);
    }
    toggleCssSelector(document.getElementsByName('capture_mode')[0].value);
    const watermarkCheckbox = document.getElementById('watermark_enabled');
    if (watermarkCheckbox) {
      onWatermarkChange(watermarkCheckbox.checked);
    }
    const form = document.querySelector('form.form-page');
    for (const name of ['watermark_text', 'watermark_opacity', 'browser_width', 'browser_height']) {
      form.elements[name].addEventListener('input', scheduleWatermarkPreview);
    }
    document.getElementById('watermark_angle_offset').addEventListener('input', scheduleWatermarkPreview);
    document.getElementById('watermark_reset').addEventListener('click', () => {
      watermarkCheckbox.checked = true;
      form.elements.watermark_text.value = '王';
      form.elements.watermark_opacity.value = '20';
      document.getElementById('watermark_angle_offset').value = '0';
      onWatermarkChange(true);
    });
  });
</script>
{% endblock %}
