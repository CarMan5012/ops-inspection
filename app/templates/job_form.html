{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ "编辑任务" if job.id else "新增任务" }}</h1>
  </div>
</div>

<form method="post" action="{{ action }}" class="panel form-page">
  <!-- 第一部分：基本信息 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">基本信息</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      任务名称 <span style="color: var(--danger);">*</span>
      <input name="name" value="{{ job.name or '' }}" required placeholder="例如：核心看板每日早巡检">
    </label>
    <label>
      运行环境 <span style="color: var(--danger);">*</span>
      <input name="environment" value="{{ job.environment or '生产环境' }}" required placeholder="例如：生产环境、测试环境">
    </label>
  </div>

  <!-- 第二部分：执行计划 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">巡检时间</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label class="span-2">
      时间设置 <span style="color: var(--danger);">*</span>
      <select name="schedule_mode" id="job-schedule-mode-select" onchange="toggleScheduleMode(this.value)">
        <option value="simple" {% if job.schedule_mode == 'simple' or not job.schedule_mode %}selected{% endif %}>按时间设置</option>
        <option value="cron" {% if job.schedule_mode == 'cron' %}selected{% endif %}>Cron 表达式</option>
      </select>
    </label>

    <!-- 简单中文时间配置 -->
    <div id="simple_schedule_container" class="span-2" style="background: #f8fafc; border: 1px solid var(--panel-border); padding: 16px; border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <label class="span-2">
        巡检频率
        <select name="frequency" id="frequency_select">
          <option value="daily">每天</option>
          <option value="workday">周一到周五</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" name="morning_enabled" id="morning_enabled_chk">
        启用上午巡检
      </label>
      <label>
        上午时间
      <input type="text" name="morning_time" id="morning_time_val" value="09:05" placeholder="09:05" pattern="([0-1][0-9]|2[0-3]):([0-5][0-9]|[Rr])" required>
        <label class="check" style="display: inline-block; margin-top: 6px; font-size: 12px; font-weight: normal; color: var(--text-muted);">
          <input type="checkbox" id="morning_random_chk" onchange="toggleRandomMinute('morning', this.checked)">
          随机分钟执行
        </label>
      </label>

      <label class="check">
        <input type="checkbox" name="afternoon_enabled" id="afternoon_enabled_chk">
        启用下午巡检
      </label>
      <label>
        下午时间
      <input type="text" name="afternoon_time" id="afternoon_time_val" value="17:05" placeholder="17:05" pattern="([0-1][0-9]|2[0-3]):([0-5][0-9]|[Rr])" required>
        <label class="check" style="display: inline-block; margin-top: 6px; font-size: 12px; font-weight: normal; color: var(--text-muted);">
          <input type="checkbox" id="afternoon_random_chk" onchange="toggleRandomMinute('afternoon', this.checked)">
          随机分钟执行
        </label>
      </label>
    </div>

    <!-- 高级 Cron 表达式配置 -->
    <label id="cron_schedule_container" class="span-2">
      Cron 表达式 <span style="color: var(--danger);">*</span>
      <input name="cron_expression" value="{{ job.cron_expression or '0 9 * * *' }}">
      <span class="form-tip">5 位 Cron，例如 <code>0 9 * * *</code>（每天 9 点）。</span>
    </label>
  </div>

  <!-- 第三部分：报告文件与推送 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">报告与通知</h3>
  <div class="form-grid" style="margin-bottom: 30px;">
    <label>
      报告标题 <span style="color: var(--danger);">*</span>
      <input name="report_title" value="{{ job.report_title or '自动化巡检报告' }}" required>
      <span class="form-tip">用于报告封面和文件名。</span>
    </label>
    <label>
      时间范围 <span style="color: var(--danger);">*</span>
      <input name="time_range_label" value="{{ job.time_range_label or '最近24小时' }}" required>
    </label>
    <!-- 钉钉群组推送 -->
    <div class="span-2" style="background: #f8fafc; border: 1px solid var(--panel-border); padding: 16px; border-radius: 6px; margin-top: 10px;">
      <label class="check" style="margin-bottom: 0; display: block; font-weight: 600;">
        <input name="dingtalk_enabled" type="checkbox" {% if job.dingtalk_enabled %}checked{% endif %}>
        发送钉钉通知（使用系统配置）
      </label>
    </div>
  </div>

  <!-- 第四部分：浏览器运行配置 -->
  <h3 style="border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 16px; font-size: 14px;">浏览器设置</h3>
  <div class="form-grid" style="margin-bottom: 24px;">
    <label>
      浏览器宽度（px） <span style="color: var(--danger);">*</span>
      <input name="browser_width" type="number" value="{{ job.browser_width or 3840 }}" required>
    </label>
    <label>
      浏览器高度（px） <span style="color: var(--danger);">*</span>
      <input name="browser_height" type="number" value="{{ job.browser_height or 2160 }}" required>
      <span class="form-tip">真实窗口截图的最终图片高度，已包含任务栏。</span>
    </label>
    <label>
      显示缩放 <span style="color: var(--danger);">*</span>
      <input name="browser_scale_factor" type="number" step="0.1" min="0.5" max="3.0" value="{{ job.get('browser_scale_factor') if job.get('browser_scale_factor') is not none else 1.5 }}" required>
      <span class="form-tip">1.5 = 浏览器按 150% 显示，截图尺寸不变。</span>
    </label>
    
    <div class="span-2" style="display: flex; gap: 24px; margin: 8px 0; flex-wrap: wrap;">
      <label class="check">
        <input name="enabled" type="checkbox" {% if job.enabled is not defined or job.enabled %}checked{% endif %}>
        启用定时巡检
      </label>
    </div>
  </div>

  <div class="form-actions span-2">
    <button class="primary" type="submit" style="font-weight: 600;">保存任务配置</button>
    <a class="button" href="{{ url_for_frontend('/jobs/' ~ job.id if job.id else '/') }}">取消并返回</a>
  </div>
</form>

<script>
  function tryParseCronToSimple(cron) {
    if (!cron) return null;
    
    const cronParts = cron.split(';').map(p => p.trim()).filter(Boolean);
    if (cronParts.length === 0) return null;
    
    let result = {
      frequency: "daily",
      morning_enabled: false,
      morning_time: "",
      afternoon_enabled: false,
      afternoon_time: ""
    };
    
    for (const cronStr of cronParts) {
      const parts = cronStr.split(/\s+/);
      if (parts.length !== 5) return null;
      const [mPart, hPart, domPart, monPart, dowPart] = parts;
      if (domPart !== "*" || monPart !== "*") return null;
      
      let frequency = "daily";
      if (dowPart === "*" || dowPart === "?") {
        frequency = "daily";
      } else if (dowPart === "1-5" || dowPart === "mon-fri" || dowPart === "1,2,3,4,5") {
        frequency = "workday";
      } else {
        return null;
      }
      result.frequency = frequency;
      
      const hours = hPart.split(",").map(Number);
      const minutes = mPart.split(",").map(Number);
      if (hours.some(isNaN) || minutes.some(isNaN) || hours.length > 2) return null;
      
      if (hours.length === 1) {
        const h = hours[0];
        if (minutes.length !== 1) return null;
        const m = minutes[0];
        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        if (h < 12) {
          result.morning_enabled = true;
          result.morning_time = timeStr;
        } else {
          result.afternoon_enabled = true;
          result.afternoon_time = timeStr;
        }
      } else if (hours.length === 2) {
        const h1 = Math.min(...hours);
        const h2 = Math.max(...hours);
        if (h1 >= 12 || h2 < 12) return null;
        let m1, m2;
        if (minutes.length === 1) {
          m1 = m2 = minutes[0];
        } else if (minutes.length === 2) {
          m1 = minutes[0];
          m2 = minutes[1];
        } else {
          return null;
        }
        result.morning_enabled = true;
        result.morning_time = `${String(h1).padStart(2, '0')}:${String(m1).padStart(2, '0')}`;
        result.afternoon_enabled = true;
        result.afternoon_time = `${String(h2).padStart(2, '0')}:${String(m2).padStart(2, '0')}`;
      } else {
        return null;
      }
    }
    
    if (!result.morning_time) result.morning_time = "09:05";
    if (!result.afternoon_time) result.afternoon_time = "17:05";
    
    if (!result.morning_enabled && !result.afternoon_enabled) return null;
    
    return result;
  }

  function toggleRandomMinute(prefix, checked) {
    const timeInput = document.getElementById(prefix + '_time_val');
    if (!timeInput) return;
    
    let currentVal = timeInput.value.trim();
    let hour = prefix === "morning" ? "09" : "17";
    
    if (currentVal && currentVal.includes(':')) {
      hour = currentVal.split(':')[0];
    }
    
    if (checked) {
      let currentMin = currentVal.includes(':') ? currentVal.split(':')[1] : "05";
      if (currentMin.toUpperCase() === "R") {
        currentMin = "05";
      }
      timeInput.dataset.savedMinute = currentMin;
    } else {
      let savedMin = timeInput.dataset.savedMinute || "05";
      if (savedMin.toUpperCase() === "R") {
        savedMin = "05";
      }
      timeInput.value = `${hour}:${savedMin}`;
    }
  }

  function toggleScheduleMode(mode) {
    const simpleContainer = document.getElementById('simple_schedule_container');
    const cronContainer = document.getElementById('cron_schedule_container');
    if (mode === 'simple') {
      simpleContainer.style.display = 'grid';
      cronContainer.style.display = 'none';
      cronContainer.querySelector('input').removeAttribute('required');
    } else {
      simpleContainer.style.display = 'none';
      cronContainer.style.display = 'block';
      cronContainer.querySelector('input').setAttribute('required', 'required');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const morningCheck = document.getElementById('morning_enabled_chk');
    const morningTimeInput = document.getElementById('morning_time_val');
    const afternoonCheck = document.getElementById('afternoon_enabled_chk');
    const afternoonTimeInput = document.getElementById('afternoon_time_val');
    
    function updateTimeInputs() {
      morningTimeInput.disabled = !morningCheck.checked;
      const morningRandomChk = document.getElementById('morning_random_chk');
      if (morningRandomChk) morningRandomChk.disabled = !morningCheck.checked;

      afternoonTimeInput.disabled = !afternoonCheck.checked;
      const afternoonRandomChk = document.getElementById('afternoon_random_chk');
      if (afternoonRandomChk) afternoonRandomChk.disabled = !afternoonCheck.checked;
    }
    morningCheck.addEventListener('change', updateTimeInputs);
    afternoonCheck.addEventListener('change', updateTimeInputs);

    // 回显配置
    const configStr = '{{ job.schedule_config | safe if job.schedule_config else "" }}';
    let scheduleMode = '{{ job.schedule_mode or "simple" }}';
    let sc = null;
    
    if (configStr) {
      try {
        sc = JSON.parse(configStr);
      } catch (e) {
        console.error("Failed to parse schedule_config", e);
      }
    } else {
      const cronExpr = '{{ job.cron_expression or "" }}';
      if (cronExpr) {
        sc = tryParseCronToSimple(cronExpr);
        if (!sc) {
          scheduleMode = 'cron';
        }
      }
    }

    const scheduleModeSelect = document.getElementById('job-schedule-mode-select');
    scheduleModeSelect.value = scheduleMode;
    toggleScheduleMode(scheduleMode);

    const cronExpr = '{{ job.cron_expression or "" }}';
    const cronSimple = tryParseCronToSimple(cronExpr);

    if (sc) {
      document.getElementById('frequency_select').value = sc.frequency || 'daily';
      morningCheck.checked = sc.morning_enabled !== undefined ? sc.morning_enabled : true;
      
      if (sc.morning_time && sc.morning_time.toUpperCase().endsWith(':R')) {
        document.getElementById('morning_random_chk').checked = true;
        morningTimeInput.value = (cronSimple && cronSimple.morning_time) ? cronSimple.morning_time : '09:05';
      } else {
        morningTimeInput.value = sc.morning_time || '09:05';
      }

      afternoonCheck.checked = sc.afternoon_enabled !== undefined ? sc.afternoon_enabled : true;
      
      if (sc.afternoon_time && sc.afternoon_time.toUpperCase().endsWith(':R')) {
        document.getElementById('afternoon_random_chk').checked = true;
        afternoonTimeInput.value = (cronSimple && cronSimple.afternoon_time) ? cronSimple.afternoon_time : '17:05';
      } else {
        afternoonTimeInput.value = sc.afternoon_time || '17:05';
      }
    } else {
      document.getElementById('frequency_select').value = 'daily';
      morningCheck.checked = true;
      morningTimeInput.value = '09:05';
      afternoonCheck.checked = true;
      afternoonTimeInput.value = '17:05';
    }
    updateTimeInputs();

    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', () => {
        if (document.getElementById('morning_random_chk').checked) {
          const val = morningTimeInput.value.trim();
          if (val.includes(':')) {
            morningTimeInput.value = val.split(':')[0] + ':R';
          }
        }
        if (document.getElementById('afternoon_random_chk').checked) {
          const val = afternoonTimeInput.value.trim();
          if (val.includes(':')) {
            afternoonTimeInput.value = val.split(':')[0] + ':R';
          }
        }
      });
    }
  });
</script>
{% endblock %}
