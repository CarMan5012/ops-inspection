{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>基础排查</h1>
  </div>
</div>

<section class="panel">
  <table>
    <thead>
      <tr>
        <th style="width: 180px;">配置项</th>
        <th>建议</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Grafana 登录地址</td>
        <td>填写完整登录地址，例如 <code>http://localhost:3000/login</code>。</td>
      </tr>
      <tr>
        <td>截图目标地址</td>
        <td>填写完整看板地址，例如 <code>http://localhost:3000/d/xxx?orgId=1</code>。</td>
      </tr>
      <tr>
        <td>等待选择器</td>
        <td>Grafana 看板推荐 <code>.react-grid-layout</code>，Kibana 看板推荐 <code>[data-test-subj=dashboardViewport]</code>。</td>
      </tr>
      <tr>
        <td>账号密码</td>
        <td>在认证配置中填写；可点击眼睛图标查看密码。</td>
      </tr>
    </tbody>
  </table>
</section>
{% endblock %}
