<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "运维管理后台" }}</title>
  <link rel="stylesheet" href="{{ url_for_frontend('static/app.css') }}">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for_frontend('/') }}"><span class="brand-mark"><img src="{{ url_for_frontend('static/images/logo.svg') }}" alt=""></span><span>运维管理后台</span></a>
    <nav class="nav">
      <a href="{{ url_for_frontend('/') }}#/jobs">巡检任务</a>
      <a href="{{ url_for_frontend('/') }}#/runs">运行记录</a>
      <a href="{{ url_for_frontend('/') }}#/periodic">周期报告</a>
      <a href="{{ url_for_frontend('/') }}#/auth">认证配置</a>
      <a href="{{ url_for_frontend('/') }}#/mail">邮件配置</a>
      <a href="{{ url_for_frontend('logout') }}">退出登录</a>
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script>
    // Toast Helper
    window.showToast = function (message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      if (type === 'error') {
        toast.innerHTML = `<span style="flex: 1;">${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fee2e2;cursor:pointer;font-weight:bold;margin-left:12px;font-size:16px;line-height:1;">×</button>`;
      } else {
        toast.innerHTML = `<span>${message}</span>`;
      }

      container.appendChild(toast);

      // Trigger reflow & show
      setTimeout(() => toast.classList.add('show'), 10);

      // Auto hide (Error toast stays 12 seconds unless closed)
      const duration = type === 'error' ? 12000 : 4000;
      setTimeout(() => {
        if (toast.parentNode) {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 300);
        }
      }, duration);
    };

    function getValidationLabel(field) {
      const label = field.closest('label');
      if (!label) return field.getAttribute('placeholder') || '此项';
      const clone = label.cloneNode(true);
      clone.querySelectorAll('input, textarea, select, button, .form-tip, .form-field-error').forEach((node) => node.remove());
      return clone.textContent.replace(/\s+/g, ' ').trim() || field.getAttribute('placeholder') || '此项';
    }

    function clearValidationError(field) {
      field.classList.remove('form-field-invalid');
      field.removeAttribute('aria-invalid');
      const label = field.closest('label');
      const oldError = label ? label.querySelector('.form-field-error') : null;
      if (oldError) oldError.remove();
    }

    function showValidationError(field, message) {
      clearValidationError(field);
      field.classList.add('form-field-invalid');
      field.setAttribute('aria-invalid', 'true');
      const label = field.closest('label');
      if (!label) return;
      const error = document.createElement('div');
      error.className = 'form-field-error';
      error.textContent = message;
      label.appendChild(error);
    }

    function validateManagedForm(form) {
      let firstInvalid = null;
      form.querySelectorAll('input, textarea, select').forEach((field) => {
        clearValidationError(field);
        if (field.disabled || field.type === 'hidden') return;
        const value = String(field.value || '').trim();
        const label = getValidationLabel(field);
        let message = '';
        if (field.required && field.type === 'checkbox' && !field.checked) {
          message = `请勾选${label}`;
        } else if (field.required && !value) {
          message = `请填写${label}`;
        } else if (value && field.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          message = `${label}格式不正确`;
        } else if (value && field.type === 'number') {
          const numberValue = Number(value);
          const min = field.getAttribute('min');
          const max = field.getAttribute('max');
          if (Number.isNaN(numberValue)) message = `${label}必须是数字`;
          if (!message && min !== null && numberValue < Number(min)) message = `${label}不能小于 ${min}`;
          if (!message && max !== null && numberValue > Number(max)) message = `${label}不能大于 ${max}`;
        }
        if (message) {
          showValidationError(field, message);
          if (!firstInvalid) firstInvalid = field;
        }
      });
      if (firstInvalid) {
        window.showToast('请先完善表单中的必填信息', 'error');
        try {
          firstInvalid.scrollIntoView({ block: 'center', behavior: 'smooth' });
          firstInvalid.focus({ preventScroll: true });
        } catch (_) {
          firstInvalid.focus();
        }
        return false;
      }
      return true;
    }

    function bindManagedValidation(root = document) {
      root.querySelectorAll('form').forEach((form) => {
        form.setAttribute('novalidate', 'novalidate');
        form.querySelectorAll('input, textarea, select').forEach((field) => {
          field.addEventListener('input', () => clearValidationError(field));
          field.addEventListener('change', () => clearValidationError(field));
        });
      });
    }

    // Global Form Submit Handlers for Loading States
    document.addEventListener('submit', function (e) {
      const form = e.target;
      if (!validateManagedForm(form)) {
        e.preventDefault();
        return;
      }
      const action = form.getAttribute('action') || '';
      const submitBtn = form.querySelector('button[type="submit"]');

      if (submitBtn) {
        if (action.includes('/run') && !action.includes('/periodic-reports')) {
          e.preventDefault();
          submitBtn.classList.add('btn-loading');
          window.showToast('巡检任务已启动，正在后台截图，请稍候...', 'info');
          setTimeout(() => form.submit(), 600);
        } else if (action.includes('/items/') && action.includes('/test')) {
          e.preventDefault();
          submitBtn.classList.add('btn-loading');
          window.showToast('开始单项测试截图，正在执行，请稍候...', 'info');
          setTimeout(() => form.submit(), 600);
        } else if (action.includes('/auth-profiles/') && action.includes('/test')) {
          e.preventDefault();
          submitBtn.classList.add('btn-loading');
          window.showToast('正在测试登录认证配置，请稍候...', 'info');
          setTimeout(() => form.submit(), 600);
        } else if (action.includes('/mail-profiles/') && action.includes('/test')) {
          e.preventDefault();
          submitBtn.classList.add('btn-loading');
          window.showToast('正在发送测试邮件，请稍候...', 'info');
          setTimeout(() => form.submit(), 600);
        } else if (action.includes('/periodic-reports/') && action.includes('/run')) {
          e.preventDefault();
          submitBtn.classList.add('btn-loading');
          window.showToast('周期汇总报告生成任务已启动，请稍候...', 'info');
          setTimeout(() => form.submit(), 600);
        }
      }
    });

    // Make active link in navbar highlighted & show success/error toasts from URL
    document.addEventListener('DOMContentLoaded', () => {
      bindManagedValidation();
      const currentPath = window.location.pathname;
      const navLinks = document.querySelectorAll('.nav a');
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (currentPath === href || (href !== '/' && currentPath.startsWith(href))) {
          link.classList.add('active');
        }
      });

      // Capture messages from URL parameters and show them as toast
      const params = new URLSearchParams(window.location.search);
      const successMsg = params.get('success');
      const errorMsg = params.get('error');
      if (successMsg) {
        window.showToast(successMsg, 'success');
      }
      if (errorMsg) {
        window.showToast(errorMsg, 'error');
      }
      if (successMsg || errorMsg) {
        // Replace URL to prevent toast popup again on refresh
        const newUrl = window.location.pathname;
        window.history.replaceState({}, document.title, newUrl);
      }
    });
  </script>
</body>

</html>
